<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My GitHub Animation</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #0d1117; /* GitHub dark theme background */
    }

    .orb {
      width: 80px;
      height: 80px;
      background: linear-gradient(45deg, #58a6ff, #bc8cff);
      border-radius: 50%;
      /* Links the element to the @keyframes rule below */
      animation: bounceAndGlow 2s infinite ease-in-out;
    }

    /* Defines the animation stages from start (0%) to finish (100%) */
    @keyframes bounceAndGlow {
      0%, 100% {
        transform: translateY(0) scale(1);
        box-shadow: 0 0 20px rgba(88, 166, 255, 0.4);
      }
      50% {
        transform: translateY(-100px) scale(1.15);
        box-shadow: 0 20px 50px rgba(188, 140, 255, 0.8);
      }
    }
  </style>
</head>
<body>
  <div class="orb"></div>
</body>
</html>
